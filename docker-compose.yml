services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://trading:${POSTGRES_PASSWORD:-trading}@db:5432/trading
      JWT_SECRET_KEY: change-me
      INITIAL_CASH: 1000000.00
      MARKET_PROVIDER: ${MARKET_PROVIDER:-akshare}
      SIMULATION_MARKET_DATA: 'false'
      ALLOW_OFF_HOURS_TRADING: 'true'
    depends_on:
      - db
    ports:
      - '8000:8000'

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  pgdata:
