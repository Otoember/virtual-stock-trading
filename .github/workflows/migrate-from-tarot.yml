name: One-time migrate A-stock platform from Tarot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-from-tarot.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: Otoember/Tarot
          ref: copilot/a-stock-virtual-trading-platform
          path: source

      - name: Keep only A-stock platform files
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source"
          DST="$GITHUB_WORKSPACE/target"

          cd "$DST"
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name 'workflows' -exec rm -rf {} +

          for item in backend frontend docs; do
            mkdir -p "$DST/$item"
            rsync -a --delete \
              --exclude='__pycache__/' \
              --exclude='*.pyc' \
              "$SRC/$item/" "$DST/$item/"
          done

          for file in .gitignore README.md TASKS.md DECISIONS.md docker-compose.yml; do
            cp -a "$SRC/$file" "$DST/$file"
          done

          cd "$DST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to clean."
            exit 0
          fi
          git commit -m "Separate A-stock platform from Tarot code"
          git push origin HEAD:main
